[build]
  functions = "netlify/functions"

# IMAP ya no pasa por Netlify ( vive en Supabase Edge Functions). Las functions
# que quedan —image-proxy y security-gate— solo usan fetch; el pin se mantiene
# para no depender del default de runtime del sitio.
NODE_VERSION = "22"

# Configuración de cache para imágenes
[[headers]]
  for = "/.netlify/functions/image-proxy/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    CDN-Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200